<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="recap-window.css"></head><body class="recap-window"><main data-section="spend"><div id="recap-empty" hidden>回顾需要先启用 Token 消耗读取。<button id="recap-open-settings" type="button">打开 Token 消耗设置</button></div><div id="recap-section" hidden><div class="spend-section-title">用量回顾</div><div class="recap-workspace"><div class="recap-stage"><div class="recap-viewer"><div id="recap-stage-message" class="recap-stage-message" hidden><strong id="recap-stage-title"></strong><small id="recap-stage-detail"></small><button id="recap-retry" type="button" hidden>重试</button></div><button id="recap-prev" type="button" aria-label="上一张">‹</button><canvas id="recap-canvas" width="1080" height="1920" aria-label="用量回顾预览"></canvas><button id="recap-next" type="button" aria-label="下一张">›</button></div><div class="recap-pagination"><div id="recap-dots" aria-label="选择回顾卡片"></div><span id="recap-page"></span></div></div><div class="recap-sidebar"><div class="recap-field"><strong>周期</strong><div class="recap-segments" role="group" aria-label="回顾周期"><button type="button" data-recap-kind="day">日</button><button type="button" data-recap-kind="week">周</button><button type="button" data-recap-kind="month">月</button><button type="button" data-recap-kind="year">年</button></div><select id="recap-kind" aria-label="回顾周期" hidden><option value="day">日</option><option value="week">周</option><option value="month" selected>月</option><option value="year">年</option></select><div class="recap-period"><input id="recap-date" type="date" aria-label="回顾日期" hidden><select id="recap-period-picker" aria-label="选择回顾日期"></select><button id="recap-earlier" type="button" aria-label="上一个周期">‹</button><button id="recap-later" type="button" aria-label="下一个周期">›</button></div></div><div class="recap-field"><strong>订阅月费</strong><div class="recap-price"><span>$</span><input id="recap-monthly-price" type="text" inputmode="decimal" placeholder="未填写" aria-label="订阅月费（美元）"></div><small>只用于回本卡；留空则不显示回本卡。</small></div><div class="recap-field"><strong>隐私</strong><label class="recap-privacy"><span>隐藏项目名称</span><input type="checkbox" id="recap-hide-projects"></label></div><div class="recap-field"><strong>卡片</strong><select id="recap-card" aria-label="回顾卡片"><option value="poster">海报</option><option value="opener">工具开场卡</option><option value="calendar">日历卡</option><option value="months">月份卡</option><option value="timetable">时间卡</option><option value="payback">回本卡</option><option value="scorecard">总结卡</option></select></div><div class="recap-actions"><small id="recap-status"></small><div><button id="recap-save" type="button">保存图片</button><button id="recap-save-all" type="button">保存全部</button><button id="recap-copy" type="button">复制图片</button></div></div></div></div></div></main><script src="money.js"></script><script src="model-pricing.js"></script><script src="spend-agents.js"></script><script src="recap-data.js"></script><script src="recap-projects.js"></script><script src="recap-stats.js"></script><script src="recap-opener.js"></script><script src="recap-timetable.js"></script><script src="recap-calendar.js"></script><script src="recap-months.js"></script><script src="recap-payback.js"></script><script src="recap-scorecard.js"></script><script src="recap-window.js"></script><script src="recap-ui.js"></script><script src="recap-window-start.js"></script></body></html>
