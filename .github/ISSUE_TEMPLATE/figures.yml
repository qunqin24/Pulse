name: A provider's numbers are wrong or missing
description: A ring is empty, stuck, showing an error, or disagreeing with the provider's own page.
title: "[Usage] "
labels: ["bug", "provider"]
body:
  - type: markdown
    attributes:
      value: |
        English or 中文, whichever you'd rather.

        Worth knowing before you write: **none of these routes is a public
        API.** Pulse borrows the login your own CLI or app already stored and
        calls the endpoint that tool calls. Those endpoints change without
        notice, and a saved token expires in hours on some providers. So "it
        worked yesterday" is a normal way for this to break, and it is still
        worth reporting — that is how we find out it moved.

  - type: checkboxes
    id: secrets
    attributes:
      label: Before you post
      options:
        - label: I have not pasted a token, key or cookie, and my screenshots don't show an email address or account id.
          required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which one
      options:
        - Claude Code
        - Codex
        - Antigravity
        - Cursor
        - OpenCode Go
        - Kimi Code
        - Ollama Cloud
    validations:
      required: true

  - type: textarea
    id: mismatch
    attributes:
      label: What Pulse says, and what it should say
      description: |
        The provider's own page or CLI is the answer we're checking against.
        Percentages and reset times both count.
      placeholder: |
        Pulse:  5-hour limit 12%, resets 18:14
        Their page: 41%, resets 18:14
    validations:
      required: true

  - type: input
    id: message
    attributes:
      label: If it shows a message instead of a number, what does it say
      placeholder: "Sign in to Codex to see usage."
    validations:
      required: false

  - type: dropdown
    id: source
    attributes:
      label: Which route, for Claude Code and Codex
      description: |
        Settings › the provider › Source. Automatic is the default: it takes
        the endpoint when it can and the other route when it can't. Pinning one
        is how you find out *which* is failing, so if you can reproduce it,
        try both.
      options:
        - Automatic
        - Pinned to the usage endpoint
        - Pinned to the other route (status line / app-server)
        - Not applicable — this provider has one route
    validations:
      required: true

  - type: dropdown
    id: account
    attributes:
      label: Which account
      options:
        - The one my CLI or app is signed in to
        - An account I added inside Pulse
    validations:
      required: true

  - type: input
    id: plan
    attributes:
      label: Which plan
      description: |
        Plans differ in which windows exist at all — ChatGPT Pro has no 5-hour
        limit, and several providers scope a limit to one model group.
      placeholder: "Claude Max 20x / ChatGPT Plus / Cursor Pro"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Pulse version
      placeholder: "1.0.2"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        A VPN or proxy client is worth mentioning — Pulse follows the system
        proxy settings, so a tunnel that stumbles surfaces here as a network
        error.
    validations:
      required: false
