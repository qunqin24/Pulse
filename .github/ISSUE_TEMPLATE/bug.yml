name: Something's broken
description: The panel, the settings, dragging, updating — anything that isn't a wrong usage figure.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. English or 中文, whichever you'd rather.

        **If a usage figure is wrong or missing, go back and pick the other
        template** — that one asks the questions that actually help.

  - type: checkboxes
    id: secrets
    attributes:
      label: Before you post
      description: |
        Pulse works with real logins, so an issue is an easy place to leak one
        by accident.
      options:
        - label: I have not pasted an API key, OAuth token, session cookie, or the contents of `~/.claude/.credentials.json`, `~/.codex/auth.json`, `keys.dat` or `accounts.dat` — and I have checked my screenshots for an email address or account id.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to get there
      placeholder: |
        1. Drag the rail off the right edge
        2. …
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Pulse version
      description: Settings › About. If you built it yourself, the commit.
      placeholder: "1.0.2"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "Apple menu › About This Mac. Please name the Mac too — a notch changes where the rail is allowed to go."
      placeholder: "macOS 26.1, MacBook Pro 14in (M3)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - The .dmg from Releases
        - Updated in place from an older version
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: placement
    attributes:
      label: Where the rail was
      description: A lot of this app is geometry, and most of the geometry bugs so far have been on one edge only.
      options:
        - Right edge
        - Left edge
        - Top edge
        - Floating on the desktop
        - Not relevant to this
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        A screen recording is worth a lot for anything that moves. If Pulse
        crashed, the report from Console › Crash Reports helps — check it for
        your account id before pasting.
    validations:
      required: false
