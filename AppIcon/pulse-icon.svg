<!--
  Apple's macOS app icon grid, since Big Sur: the artwork is a rounded square of
  824 centred on a 1024 canvas, corner radius 185.4, with the 100 of margin all
  round left for the shadow.

  macOS does **not** mask app icons the way iOS does — whatever is supplied is
  what is drawn, at every size and in every list. A full-bleed square therefore
  shows as a hard-edged square beside every other app on the Dock, which is what
  this was until the grid was applied.

  The mark itself is unchanged: it is drawn in its original 1024 space and the
  group scales it into the body, so the ring and the trace keep their
  proportions.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1c1c1f" />
      <stop offset="70%" stop-color="#0a0a0b" />
      <stop offset="100%" stop-color="#0a0a0b" />
    </radialGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4010" />
      <stop offset="100%" stop-color="#E0FF00" />
    </linearGradient>

    <!-- Baked in, because an .icns carries no shadow of its own. Kept soft and
         low: at 16pt it should read as a seated edge, not as a smudge. -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.30" />
    </filter>

    <!-- The body, and the clip that keeps the mark inside it. -->
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4" />
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"
    fill="url(#bg)" filter="url(#shadow)" />

  <g clip-path="url(#body)" transform="translate(100 100) scale(0.8046875)">
    <circle cx="512" cy="512" r="384" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="56" />
    <circle cx="512" cy="512" r="384" fill="none" stroke="url(#pulseGrad)" stroke-width="56"
      stroke-linecap="round" stroke-dasharray="1894.4 2413.6" transform="rotate(-90 512 512)" />
    <path d="M243.2,512 L384,512 L430.1,384 L491.5,640 L537.6,435.2 L583.7,512 L780.8,512"
      fill="none" stroke="#F5F5F1" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
